<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visual Scratchpad</title>
<style>
  :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; padding: 48px; background: #f4f3ef; color: #171714; }
  header { max-width: 1080px; margin: 0 auto 28px; }
  h1 { margin: 0 0 8px; font-size: 32px; letter-spacing: -0.04em; }
  p { margin: 0; color: #6e6d67; }
  .grid { max-width: 1080px; margin: auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .card { min-height: 260px; padding: 24px; border: 1px solid #d9d7d0; border-radius: 22px; background: #fff; display: flex; flex-direction: column; }
  .label { display: flex; align-items: center; gap: 10px; font-weight: 650; }
  .letter { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; background: #eeece6; font-size: 12px; }
  .stage { flex: 1; display: grid; place-items: center; }
  button { border: 0; border-radius: 12px; padding: 12px 18px; font: inherit; font-weight: 650; cursor: pointer; }
  .quiet { background: #eeece6; color: #272620; }
  .primary { background: #171714; color: #fff; }
  .warm { background: #e86539; color: #fff; box-shadow: 0 8px 22px rgb(232 101 57 / .24); }
</style>
<body>
  <header>
    <h1>Button direction</h1>
    <p>Compare hierarchy, contrast, and emphasis.</p>
  </header>
  <main class="grid">
    <section class="card"><div class="label"><span class="letter">A</span>Quiet</div><div class="stage"><button class="quiet">Continue</button></div></section>
    <section class="card"><div class="label"><span class="letter">B</span>Primary</div><div class="stage"><button class="primary">Continue</button></div></section>
    <section class="card"><div class="label"><span class="letter">C</span>Warm</div><div class="stage"><button class="warm">Continue</button></div></section>
  </main>
</body>
</html>
