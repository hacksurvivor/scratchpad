<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scratchpad HTML</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: transparent;
      color: light-dark(#171717, #f5f5f5);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: max(420px, 100vh); background: light-dark(#f4f3ef, #151515); }
    .shell { min-height: max(420px, 100vh); display: grid; grid-template-rows: auto 1fr; }
    .bar {
      min-height: 52px;
      padding: 9px 12px 9px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid light-dark(#dedbd3, #383838);
      background: light-dark(rgb(255 255 255 / .88), rgb(28 28 28 / .9));
      backdrop-filter: blur(16px);
    }
    .identity { min-width: 0; display: flex; align-items: center; gap: 10px; }
    .mark {
      width: 28px;
      height: 28px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      background: #171717;
      color: #fff;
      font: 700 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .copy { min-width: 0; }
    .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 700; }
    .status { margin-top: 2px; color: light-dark(#696761, #aaa); font-size: 11px; }
    .actions { margin-left: auto; display: flex; gap: 7px; }
    button {
      min-height: 32px;
      padding: 0 11px;
      border: 1px solid light-dark(#d4d1c9, #464646);
      border-radius: 9px;
      background: light-dark(#fff, #292929);
      color: inherit;
      font: inherit;
      font-size: 12px;
      font-weight: 650;
      cursor: pointer;
    }
    button:hover { background: light-dark(#f0eee8, #343434); }
    button:disabled { cursor: default; opacity: .45; }
    button.primary { border-color: #171717; background: #171717; color: #fff; }
    button.primary:hover { background: #2b2b2b; }
    .stage { position: relative; min-height: 368px; }
    iframe { width: 100%; height: 100%; min-height: 368px; border: 0; background: #fff; display: block; }
    .empty {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 32px;
      color: light-dark(#696761, #aaa);
      text-align: center;
      font-size: 13px;
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="shell">
    <header class="bar">
      <div class="identity">
        <div class="mark" aria-hidden="true">HTML</div>
        <div class="copy">
          <div class="title" id="title">Scratchpad HTML</div>
          <div class="status" id="status">Waiting for an artifact…</div>
        </div>
      </div>
      <div class="actions">
        <button id="send" class="primary" disabled>Send selection</button>
        <button id="expand">Open full screen</button>
      </div>
    </header>
    <section class="stage">
      <iframe id="artifact" title="Interactive Scratchpad artifact" sandbox="allow-scripts"></iframe>
      <div class="empty" id="empty">The interactive HTML artifact will appear here.</div>
    </section>
  </main>
  <script>
    (() => {
      const frame = document.getElementById("artifact");
      const empty = document.getElementById("empty");
      const title = document.getElementById("title");
      const status = document.getElementById("status");
      const send = document.getElementById("send");
      const expand = document.getElementById("expand");
      const pending = new Map();
      let nextRequestId = 1;
      let currentArtifact = null;
      let currentSelection = null;
      let bridgeReady = null;

      const rpcRequest = (method, params) => new Promise((resolve, reject) => {
        const id = nextRequestId++;
        pending.set(id, { resolve, reject });
        window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
      });

      const rpcNotify = (method, params) => {
        window.parent.postMessage({ jsonrpc: "2.0", method, params }, "*");
      };

      const escapeText = (value) => String(value ?? "").slice(0, 20000);

      const artifactFrom = (raw) => {
        if (!raw || typeof raw !== "object") return null;
        if (raw.artifact?.html) return raw.artifact;
        if (raw._meta?.artifact?.html) return raw._meta.artifact;
        if (raw.meta?.artifact?.html) return raw.meta.artifact;
        if (raw.toolResponseMetadata?.artifact?.html) return raw.toolResponseMetadata.artifact;
        if (raw.globals) return artifactFrom(raw.globals);
        return null;
      };

      const protectedHtml = (html) => {
        const csp = [
          "default-src 'none'",
          "style-src 'unsafe-inline'",
          "script-src 'unsafe-inline'",
          "img-src data: blob:",
          "font-src data:",
          "media-src data: blob:",
          "connect-src 'none'",
          "frame-src 'none'",
          "object-src 'none'",
          "form-action 'none'",
          "base-uri 'none'",
        ].join("; ");
        const meta = `<meta http-equiv="Content-Security-Policy" content="${csp}">`;
        if (/<head(?:\s[^>]*)?>/i.test(html)) {
          return html.replace(/<head(?:\s[^>]*)?>/i, (head) => `${head}${meta}`);
        }
        return `<!doctype html><html><head>${meta}</head><body>${html}</body></html>`;
      };

      const requestMode = async (mode) => {
        try {
          if (window.openai?.requestDisplayMode) {
            await window.openai.requestDisplayMode({ mode });
            return;
          }
          const initialized = await bridgeReady;
          const available = initialized?.hostContext?.availableDisplayModes;
          if (Array.isArray(available) && !available.includes(mode)) return;
          await rpcRequest("ui/request-display-mode", { mode });
        } catch {
          // Inline rendering remains usable when the host declines expansion.
        }
      };

      const applyArtifact = (raw) => {
        const artifact = artifactFrom(raw);
        if (!artifact) return false;
        currentArtifact = artifact;
        currentSelection = null;
        send.disabled = true;
        title.textContent = escapeText(artifact.title || "Scratchpad HTML");
        status.textContent = "Interactive, local, and network-isolated";
        frame.srcdoc = protectedHtml(String(artifact.html));
        empty.hidden = true;
        if ((artifact.displayMode || "fullscreen") === "fullscreen") {
          requestMode("fullscreen");
        }
        return true;
      };

      window.addEventListener("message", (event) => {
        if (event.source === frame.contentWindow) {
          if (event.data?.type !== "scratchpad:update") return;
          currentSelection = event.data.state ?? event.data.value ?? null;
          send.disabled = currentSelection == null;
          status.textContent = currentSelection == null
            ? "Interactive, local, and network-isolated"
            : "Selection ready to send";
          return;
        }

        if (event.source !== window.parent) return;
        const message = event.data;
        if (!message || message.jsonrpc !== "2.0") {
          applyArtifact(message);
          return;
        }
        if (message.id != null) {
          const request = pending.get(message.id);
          if (!request) return;
          pending.delete(message.id);
          if (message.error) request.reject(message.error);
          else request.resolve(message.result);
          return;
        }
        if (message.method === "ui/notifications/tool-result") {
          applyArtifact(message.params);
        }
      }, { passive: true });

      window.addEventListener("openai:set_globals", (event) => {
        applyArtifact(event.detail?.globals);
      });

      expand.addEventListener("click", () => requestMode("fullscreen"));

      send.addEventListener("click", async () => {
        if (currentSelection == null) return;
        const selection = JSON.stringify(currentSelection, null, 2).slice(0, 20000);
        const message = `Scratchpad selection from "${escapeText(currentArtifact?.title || "HTML artifact")}":\n${selection}`;
        try {
          await bridgeReady;
          await rpcRequest("ui/message", {
            role: "user",
            content: [{ type: "text", text: message }],
          });
          status.textContent = "Selection sent to Codex";
        } catch {
          status.textContent = "Could not send selection; describe it in chat instead";
        }
      });

      bridgeReady = rpcRequest("ui/initialize", {
        appInfo: { name: "scratchpad-html", version: "1.0.0" },
        appCapabilities: {
          availableDisplayModes: ["inline", "fullscreen"],
        },
        protocolVersion: "2026-01-26",
      }).then(() => rpcNotify("ui/notifications/initialized", {}));

      applyArtifact(window.openai?.toolResponseMetadata);
      applyArtifact(window.openai?.toolOutput);
    })();
  </script>
</body>
</html>
